<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="referrer" content="no-referrer" />
    <title>Delayed by THorn HTTP</title>
    <link rel="stylesheet" href="index.css" />
  </head>
  <body>
    <main>
      <h1>THorn HTTP is delaying this page</h1>
      <p>A Delay rule holds this page load for <b id="total"></b>.</p>
      <p class="countdown" id="countdown"></p>
      <p class="url" id="url"></p>
      <button id="load-now" type="button">Load now</button>
      <p class="note">
        This all happens in your browser: when the time is up, the page is loaded straight from its site, and nothing is
        sent anywhere else. Switch the rule off in THorn HTTP to stop delaying it.
      </p>
    </main>
    <script src="index.js"></script>
  </body>
</html>
