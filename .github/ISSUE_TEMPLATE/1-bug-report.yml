name: 🐛 Bug report
description: Something in Thorn HTTP doesn't work as expected
labels: ["bug"]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you do, what did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: rule
    attributes:
      label: Rule (optional)
      description: Export the rule (Rules → select → Export) and paste the JSON here.
      render: json
  - type: input
    id: browser
    attributes:
      label: Browser and version
      placeholder: Chrome 140, Edge 140, Firefox 143...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Thorn HTTP version
      description: Shown at the bottom of the popup.
    validations:
      required: true
