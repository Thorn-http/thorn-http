name: 🐛 Bug report
description: Something in Thorn HTTP doesn't work as expected
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting! Please fill in as much as you can: a bug that can be reproduced is a bug that can be fixed.
        **Security vulnerabilities must not be reported here**: see [SECURITY.md](https://github.com/Thorn-http/thorn-http/blob/main/SECURITY.md).
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear description of the bug.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Create a Redirect rule with ...
        2. Open https://...
        3. See ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: rule
    attributes:
      label: Rule (optional)
      description: Export the rule (Rules → select → Export) and paste the JSON. Remove anything private first.
      render: json
  - type: textarea
    id: test-url
    attributes:
      label: Test URL result (optional)
      description: If a rule doesn't apply, open it, click **Test URL**, paste the URL and copy what the checklist says.
  - type: dropdown
    id: browser
    attributes:
      label: Browser
      options:
        - Chrome
        - Edge
        - Firefox
        - Other (write it below)
    validations:
      required: true
  - type: input
    id: browser-version
    attributes:
      label: Browser version
      placeholder: "e.g. 140.0.7339.80"
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Thorn HTTP version
      description: Shown in the popup.
      placeholder: "e.g. 1.0.0"
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: "e.g. Windows 11, macOS 15, Ubuntu 24.04"
  - type: textarea
    id: extra
    attributes:
      label: Anything else?
      description: Screenshots, console errors (from the page or from the extension's service worker), other extensions that intercept requests...
  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I searched the existing issues and this hasn't been reported yet.
          required: true
        - label: This is not a security vulnerability.
          required: true
